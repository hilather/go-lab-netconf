apiVersion: labnetconf.dev/v1alpha1
kind: LabNETCONF
metadata:
  name: admission-empty
spec:
  listeners:
    netconf:
      hostKeyFile: /run/secrets/labnetconf-hostkey
  admission:
    allowClientCidrs: []
  profiles:
    - name: router-a
      schema:
        - path: "ietf-system:system/hostname"
          type: string
          access: write
      instance:
        ietf-system:
          system:
            hostname: "lab-rtr-a"
  users:
    - name: alice
      passwordFile: /run/secrets/netconf-alice
      profile: router-a
      access: read-write
