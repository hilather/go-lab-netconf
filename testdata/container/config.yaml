apiVersion: labnetconf.dev/v1alpha1
kind: LabNETCONF
metadata:
  name: container-smoke
spec:
  listeners:
    netconf:
      enabled: true
      address: ":830"
      hostKeyFile: /etc/labnetconf/hostkey
    restconf:
      enabled: true
      address: ":8303"
      tls:
        enabled: false
    management:
      address: ":8088"
      restPath: /v1
      mcpPath: /mcp
  auth:
    mode: bearer
    tokens:
      - id: smoke
        role: administrator
        secretFile: /etc/labnetconf/token
  ui:
    enabled: false
  netconf:
    versions: ["1.0", "1.1"]
    writableRunning: false
    notifications:
      enabled: true
    sharedProfileDatastore: true
  restconf:
    json: true
    xml: false
  admission:
    allowClientCidrs:
      - "0.0.0.0/0"
      - "::/0"
  profiles:
    - name: router-a
      modules:
        - name: ietf-system
          revision: "2014-08-06"
          namespace: "urn:ietf:params:xml:ns:yang:ietf-system"
      schema:
        - path: "ietf-system:system/hostname"
          type: string
          access: write
      instance:
        ietf-system:
          system:
            hostname: "lab-rtr-a"
  users:
    - name: alice
      passwordFile: /etc/labnetconf/alice.password
      profile: router-a
      access: read-write
